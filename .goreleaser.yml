project_name: wnc
version: 2

dist: tmp/dist

github_urls:
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd
    id: wnc
    binary: wnc
    flags:
      - -trimpath
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/umatare5/wnc/internal/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo crept
        # back in. It has to stay a single command with no pipe: goreleaser runs a hook
        # without a shell, so a pipeline would be passed as arguments and assert nothing.
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - "README.md"
      - "LICENSE"
      - "docs/*.md"
      - "docs/commands/*.md"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# A prerelease must not move latest or the minor tag.
dockers_v2:
  - id: exact
    images: ["ghcr.io/umatare5/wnc"]
    tags: ["{{ .Tag }}"]
    platforms: ["linux/amd64", "linux/arm64"]
    dockerfile: Dockerfile
    ids: [wnc]
    extra_files:
      - "LICENSE"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for Cisco Catalyst 9800 Wireless Network Controllers"
      org.opencontainers.image.url: "https://github.com/umatare5/wnc"
      org.opencontainers.image.source: "https://github.com/umatare5/wnc"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"
  - id: moving
    disable: '{{ if .Prerelease }}true{{ end }}'
    images: ["ghcr.io/umatare5/wnc"]
    tags:
      - "latest"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms: ["linux/amd64", "linux/arm64"]
    dockerfile: Dockerfile
    ids: [wnc]
    extra_files:
      - "LICENSE"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI for Cisco Catalyst 9800 Wireless Network Controllers"
      org.opencontainers.image.url: "https://github.com/umatare5/wnc"
      org.opencontainers.image.source: "https://github.com/umatare5/wnc"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

release:
  prerelease: auto
  draft: true
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    A command-line interface for Cisco Catalyst 9800 Wireless Network Controllers.

    > [!IMPORTANT]
    > A minor release may rename or remove a column. Read the release notes before
    > upgrading anything that parses the JSON output.

    ### Container images

    ```bash
    docker run --rm ghcr.io/umatare5/wnc:{{ .Tag }} --help
    ```

    ### Binaries

    Download a prebuilt binary for your platform from the assets below.
  footer: |
    **Full Changelog**: https://github.com/umatare5/wnc/compare/{{ .PreviousTag }}...{{ .Tag }}

checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
