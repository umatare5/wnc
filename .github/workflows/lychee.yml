name: Link Check

# The automatic triggers are commented out until this branch reaches main.
# Three README URLs name paths main does not carry yet — the go-test-build
# badge, CONTRIBUTING.md and docs/assets/coverage.svg — so the check reports a
# 404 that the merge itself resolves. Restore the two blocks below in the first
# commit after that merge; workflow_dispatch keeps the workflow valid meanwhile,
# because a file whose whole body is commented out fails actionlint as empty.
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - "**/*.md"
  #     - "lychee.toml"
  #     - ".github/workflows/lychee.yml"
  # pull_request:
  #   paths:
  #     - "**/*.md"
  #     - "lychee.toml"
  #     - ".github/workflows/lychee.yml"

permissions:
  contents: read

jobs:
  lychee:
    uses: umatare5/common/.github/workflows/lychee.yml@3df623d482350006c12656381399db14f8879fcc # v0.19.0
    with:
      lychee_version: "v0.24.2"
